name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            archive_name: zodex-x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            archive_name: zodex-aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            linker: aarch64-linux-gnu-gcc
            apt_packages: gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          - target: aarch64-apple-darwin
            archive_name: zodex-aarch64-apple-darwin
            os: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux cross linker
        if: ${{ matrix.apt_packages }}
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends ${{ matrix.apt_packages }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binaries
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.linker }}
        run: |
          cargo build --locked --release --target "${{ matrix.target }}" \
            --bin zodex \
            --bin zodex-agent \
            --bin git-remote-zodex \
            --bin zodexd \
            --bin zodex-prd

      - name: Package release archive
        run: |
          mkdir -p "dist/${{ matrix.archive_name }}"
          cp "target/${{ matrix.target }}/release/zodex" "dist/${{ matrix.archive_name }}/"
          cp "target/${{ matrix.target }}/release/zodex-agent" "dist/${{ matrix.archive_name }}/"
          cp "target/${{ matrix.target }}/release/git-remote-zodex" "dist/${{ matrix.archive_name }}/"
          cp "target/${{ matrix.target }}/release/zodexd" "dist/${{ matrix.archive_name }}/"
          cp "target/${{ matrix.target }}/release/zodex-prd" "dist/${{ matrix.archive_name }}/"
          tar -C dist -czf "dist/${{ matrix.archive_name }}.tar.gz" "${{ matrix.archive_name }}"
          (
            cd dist
            shasum -a 256 "${{ matrix.archive_name }}.tar.gz" > "${{ matrix.archive_name }}.tar.gz.sha256"
          )

      - name: Smoke test packaged macOS Local operator
        if: contains(matrix.target, 'apple-darwin')
        shell: bash
        run: |
          set -euo pipefail
          smoke_root="$(mktemp -d)"
          trap 'rm -rf "$smoke_root"' EXIT
          install_dir="$smoke_root/install"
          mkdir -p "$install_dir"

          if tar -tzf "dist/${{ matrix.archive_name }}.tar.gz" \
              | grep -E '/(tunnel-client|cloudflared|cloudflared-manifest\.json|history\.sqlite3|observability-bearer|mcp-token|environment\.json|tunnel-profile\.yaml|local-launch-agent\.plist)$' >/dev/null; then
            echo "macOS operator release must not bundle Local setup/runtime/private-state files" >&2
            exit 1
          fi

          ZODEX_ASSET_URL="file://${GITHUB_WORKSPACE}/dist/${{ matrix.archive_name }}.tar.gz" \
          ZODEX_INSTALL_DIR="$install_dir" \
            bash scripts/install.sh

          test -x "$install_dir/zodex"
          test ! -e "$install_dir/zodexd"
          test ! -e "$install_dir/zodex-prd"
          test ! -e "$install_dir/zodex-agent"
          "$install_dir/zodex" local --help >/dev/null
          "$install_dir/zodex" local setup --help >/dev/null

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive_name }}
          path: |
            dist/${{ matrix.archive_name }}.tar.gz
            dist/${{ matrix.archive_name }}.tar.gz.sha256

      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ matrix.archive_name }}.tar.gz
            dist/${{ matrix.archive_name }}.tar.gz.sha256
